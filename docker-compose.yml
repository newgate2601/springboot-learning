version: '3'
services:
  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"
    networks:
      - kafka-network

  kafka:
    image: wurstmeister/kafka
    ports:
      - "9092:9092"  # Kafka port để máy local có thể kết nối
    environment:
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092  # Định nghĩa các listener với cổng
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT  # Chế độ bảo mật cho listener
      KAFKA_LISTENER_NAMES: INSIDE,OUTSIDE  # Đặt tên cho các listener
      KAFKA_LISTENER_PORTS: 9093,9092  # Cổng cho các listener
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093,OUTSIDE://localhost:9092  # Quảng bá các listener
      KAFKA_LISTENER_INTERFACE: eth0  # Dùng eth0 cho các kết nối bên ngoài
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181  # Kết nối tới Zookeeper
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE  # Xác định listener nội bộ cho các giao tiếp giữa các broker
    networks:
      - kafka-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"  # Kafka UI truy cập qua port 8080
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: "kafka:9093"  # Kafka UI kết nối tới Kafka qua tên dịch vụ "kafka" và cổng 9093
    depends_on:
      - kafka
    networks:
      - kafka-network

networks:
  kafka-network:
    driver: bridge