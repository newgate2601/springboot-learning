version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://host.docker.internal:5432/keycloak
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=your_password
      - KC_HOSTNAME=localhost
      - KC_HTTP_CORS_ALLOWED_ORIGINS=http://localhost:8081
      - KC_PROXY=edge
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["start-dev"]
    networks:
      - keycloak-network

networks:
  keycloak-network:
    driver: bridge