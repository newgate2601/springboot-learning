<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Product Preview">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="product" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f3ff"/>
      <stop offset="1" stop-color="#f4e9ff"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f5f7fb"/>
  <rect x="28" y="22" width="1144" height="576" rx="18" fill="#eef3f8" stroke="none" />
<text x="52" y="62" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#172033" >Product Preview</text>
<rect x="80" y="112" width="1040" height="420" rx="16" fill="#ffffff" stroke="#d9e0ea" /><text x="116" y="162" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#7c3aed" >Preview Mode - Product chưa public</text>
<rect x="116" y="204" width="360" height="210" rx="12" fill="url(#product)" stroke="#d7e2ef" /><text x="520" y="242" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" fill="#172033" >Giao diện giống Product Detail của customer</text><text x="520" y="284" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#b45309" >Warning: thiếu ảnh chính, chưa có đủ SKU hoặc giá.</text>
<rect x="520" y="360" width="170" height="42" rx="8" fill="#344054" stroke="none" /><text x="536" y="386" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" >Quay lại chỉnh sửa</text><rect x="708" y="360" width="110" height="42" rx="8" fill="#087443" stroke="none" /><text x="724" y="386" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" >Publish</text>
