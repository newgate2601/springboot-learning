<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Garden</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f3eb;color:#254532;font:16px/1.7 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:640px;margin:auto;padding:25px 23px 50px}.brand{font-size:11px;font-weight:800;letter-spacing:2px;color:#82916a}.hero{padding:24px 0 17px}.emoji{font-size:54px}h1{font:normal 48px/1.12 Georgia,serif;letter-spacing:-1.5px;margin:15px 0 10px;overflow-wrap:anywhere}.pos{font-size:12px;background:#e6eddd;border-radius:5px;padding:4px 8px;color:#637c55}.meaning{font-size:23px;line-height:1.5;margin:20px 0 10px}.recording{background:#fffef9;border:1px solid #dce4d1;border-radius:16px;padding:16px;margin:12px 0}.lemma{font-size:12px;color:#718463;margin-bottom:9px}.sounds{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sound{border:1px solid #cad8bd;background:#edf2e4;border-radius:12px;color:#295836;min-height:82px;padding:12px 8px;cursor:pointer;font:inherit}.sound strong{display:block;font-size:16px}.sound span{display:block;font-size:14px;margin-top:4px;overflow-wrap:anywhere}.sound[aria-pressed=true]{background:#286b4c;color:white;border-color:#286b4c}.source{font-size:11px;display:block;margin-top:10px;color:#718463}section{margin-top:26px}h2{font-size:11px;letter-spacing:1.6px;color:#829368;text-transform:uppercase;margin:0 0 9px}.example{background:#fffefa;padding:20px;border-radius:15px;border:1px solid #dfe6d6}.english{font-size:20px;font-weight:600;line-height:1.55;margin:0}.translation{font-size:16px;color:#71806b;margin:11px 0 0}.note{font-size:12px;color:#899380;margin-top:20px}.usage{font-size:15px}.contrast{border-left:3px solid #cabc87;padding:13px 16px;background:#efeddf;border-radius:0 10px 10px 0}.term{font-weight:650;color:#345d37}#status{font-size:13px;color:#9d4e31;min-height:20px;margin-top:12px}button:focus-visible,a:focus-visible{outline:3px solid #d5aa51;outline-offset:3px}audio{width:100%;margin-top:8px}@media(prefers-color-scheme:dark){body{background:#18261f;color:#edf1e8}.recording,.example{background:#22352a;border-color:#3b4c38}.pos,.sound{background:#304733;color:#e2ebd9;border-color:#4a6540}.translation,.lemma,.source{color:#afc19f}.contrast{background:#30382b}.term{color:#c4dbb4}}@media(max-width:340px){main{padding:20px 17px}h1{font-size:39px}.sounds{grid-template-columns:1fr}}
</style></head><body><main><div class="brand">WORD GARDEN ✿</div><div class="hero"><div class="emoji" id="emoji"></div><h1 id="word"></h1><span class="pos" id="pos"></span><p class="meaning" id="meaning"></p></div><button type="button" id="next-word" style="display:block;width:100%;font:600 17px -apple-system,sans-serif;padding:15px 18px;border:1px solid #286b4c;border-radius:13px;background:#286b4c;color:white;cursor:pointer;margin:0 0 25px">Đổi từ →</button><h2>Chạm để nghe · bản thu Oxford</h2><div id="recordings"></div><div id="status" role="status" aria-live="polite"></div><section class="example"><h2>Ví dụ tự soạn</h2><p class="english" id="example"></p><p class="translation" id="translation"></p></section><section><h2>Cách dùng chính</h2><p class="usage" id="usage"></p></section><section class="contrast"><h2>Phân biệt</h2><p class="usage" id="contrast"></p></section><p class="note">Nút US/UK phát đúng từ ở hàng tương ứng, không đọc cả câu ví dụ. Cần kết nối mạng. Chạm lại nút đang phát để dừng.</p></main><script type="application/json" id="word-data">__WORD_JSON__</script><script>
const word=JSON.parse(document.querySelector('#word-data').textContent),$=s=>document.querySelector(s);for(const k of ['word','pos','meaning','example','translation'])$('#'+k).textContent=word[k]||'';$('#emoji').textContent=word.image||'✿';
function rich(el,text){const parts=String(text||'').split(/(`[^`]+`)/g);for(const part of parts){if(part.startsWith('`')&&part.endsWith('`')){const span=document.createElement('span');span.className='term';span.textContent=part.slice(1,-1);el.append(span)}else el.append(document.createTextNode(part))}}rich($('#usage'),word.usage);rich($('#contrast'),word.contrast);
let audio=null,active=null;function stop(){if(audio){audio.pause();audio=null}if(active)active.setAttribute('aria-pressed','false');active=null}for(const p of word.pronunciations||[]){const box=document.createElement('div');box.className='recording';const label=document.createElement('div');label.className='lemma';label.textContent=p.word+' · '+p.pos;box.append(label);const sounds=document.createElement('div');sounds.className='sounds';for(const locale of ['us','uk']){const rec=p[locale];if(!rec)continue;const b=document.createElement('button');b.className='sound';b.type='button';b.setAttribute('aria-pressed','false');b.setAttribute('aria-label','Nghe '+locale.toUpperCase()+': '+p.word);const strong=document.createElement('strong');strong.textContent='▷ '+locale.toUpperCase();const ipa=document.createElement('span');ipa.textContent=rec.ipa;b.append(strong,ipa);b.onclick=()=>{const same=active===b;stop();$('#status').textContent='';if(same)return;const a=new Audio(rec.audio);audio=a;active=b;b.setAttribute('aria-pressed','true');a.onended=()=>{if(audio===a)stop()};const fail=()=>{if(audio!==a)return;stop();$('#status').textContent='Không tải được bản thu. Kiểm tra mạng hoặc mở link Oxford bên dưới.'};a.onerror=fail;a.play().catch(fail)};sounds.append(b)}box.append(sounds);const link=document.createElement('a');link.className='source';link.href=p.source;link.textContent='Nguồn Oxford ↗';link.target='_blank';link.rel='noopener';box.append(link);$('#recordings').append(box)}if(!word.pronunciations?.length)$('#status').textContent='Từ này chưa có bản thu Oxford đã xác minh.';document.querySelector('#next-word').onclick=()=>{stop();if(!word.nativeBridge){$('#status').textContent='Nút Đổi từ hoạt động trong Scriptable trên iPhone. Đây chỉ là trang xem thử.';return}$('#next-word').disabled=true;window.location.href='wordgarden-next://change'};window.addEventListener('pagehide',stop);
</script></body></html>
