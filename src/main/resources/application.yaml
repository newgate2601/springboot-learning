server:
  port: 8081
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate: ERROR
management:
  endpoints:
    web:
      exposure:
        include: '*'

keycloak:
  realm: pre-prod
  auth-server-url: http://localhost:8080  # URL Keycloak server
  resource: learning-app  # Client ID đã tạo trong Keycloak
  credentials:
    secret: 9rm0Y3Azt6R8xXKzFLSepU6L9t5aBKlO  # Lấy từ tab "Credentials" trong Keycloak Admin Console
jwt:
  auth:
    converter:
      # Client ID được cấu hình trong Keycloak mà ứng dụng này đại diện,
      # Token phải chứa claim aud (audience) khớp với giá trị này mới được chấp nhận
      resource-id: learning-app
      principal-attribute: principal_username
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Spring Security sẽ sử dụng URI này để:
          # + Xác thực rằng token được phát hành bởi Keycloak realm này
          # + Tải metadata OIDC tự động (thông qua endpoint /.well-known/openid-configuration)
          # + Giá trị này phải khớp với claim iss trong JWT token
          issuer-uri: http://localhost:8080/realms/pre-prod
          # Địa chỉ để lấy public keys (JWK - JSON Web Key) dùng để verify chữ ký của JWT:
          # + Spring sẽ sử dụng các public key này để xác thực chữ ký của token nhận được
          # + Đây là endpoint tiêu chuẩn của Keycloak cung cấp các public key
          jwk-set-uri: http://localhost:8080/realms/pre-prod/protocol/openid-connect/certs
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.id.new_generator_mappings: true
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: true
      hibernate.jdbc.lob.non_contextual_creation: true
      # modify batch size as necessary
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.query.fail_on_pagination_over_collection_fetch: true
      hibernate.query.in_clause_parameter_padding: true
      hibernate.format_sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/learning
    username: postgres
    password: 101119
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10